/* ======================= 2. RNG · SAVE · CONTRACTS ======================= */
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function lcg(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(r,a,b){return a+r()*(b-a)}
function pick(r,arr){return arr[Math.floor(r()*arr.length)%arr.length]}
function dayNum(ms){return Math.floor(ms/86400000)}

/* ======================= 3. TIME · WEATHER ======================= */
const DBG={hour:null,month:null,wx:null,mayor:false};
function realHour(){ if(DBG.hour!=null)return DBG.hour; const d=new Date(); return d.getHours()+d.getMinutes()/60 }
function realMonth(){ if(DBG.month!=null)return DBG.month; return new Date().getMonth()+1 }
function sunTimes(){ return MONTH_SUN[realMonth()-1] }
function phase(){ const h=realHour(),st=sunTimes(),sr=st[0],ss=st[1];
  if(h>=sr-0.9&&h<=sr+1.0)return 'dawn';
  if(h>=ss-1.0&&h<=ss+0.9)return 'dusk';
  if(h>sr+1.0&&h<ss-1.0)return 'day';
  return 'night' }
function frozen(){ const m=realMonth(); return m===12||m===1||m===2 }
function dateKey(off){ const d=new Date(Date.now()-(off||0)*86400000);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate() }
function wxFor(off){
  if(DBG.wx&&!off)return DBG.wx;
  const h=hash32('mudlake:'+dateKey(off||0)), r=h%100;
  const press=r<28?'falling':(r<66?'steady':'high');
  const sky=press==='falling'?(((h>>>7)%3===0)?'drizzle':'gray'):(press==='high'?'clear':(((h>>>9)%3===0)?'gray':'clear'));
  return {press:press,sky:sky,rain:sky==='drizzle',
    wind:{dir:((h>>>11)&1)?1:-1,str:.25+((h>>>13)%70)/100}};
}
function bluebird(){ const t=wxFor(0),y=wxFor(1); return t.press==='high'&&y.press==='falling' }
function actMult(sp,spot){
  const s=SP[sp]; if(!s||s.unhookable)return 0;
  const ph=phase(), wx=wxFor(0);
  const hm=ph==='dawn'?s.hours[0]:ph==='day'?s.hours[1]:ph==='dusk'?s.hours[2]:s.hours[3];
  let m=hm*(s.spots[spot]||0); if(!m)return 0;
  if(wx.press==='falling')m*=1.35; else if(wx.press==='high')m*=.62;
  if(bluebird())m*=.8;
  if(wx.rain)m*=1.12;
  if(spot==='inlet'&&wxFor(1).rain)m*=1.6;
  const side=SPOTS[spot].side||0;
  if(side!==0)m*= (side===wx.wind.dir)?(1+.2*wx.wind.str):(1-.12*wx.wind.str);
  if(spot==='drop'&&ph==='day')m*=1.12; // the willow's shade holds fish at midday
  const mo=realMonth();
  if(sp==='carp'&&mo>=6&&mo<=9)m*=1.25;
  if(sp==='bowfin'&&mo>=7&&mo<=8)m*=1.4;
  if(sp==='crappie'&&(mo===4||mo===5))m*=1.6;
  if(sp==='pike'&&mo>=6&&mo<=8)m*=.8;
  return m;
}
function baitW(sp,rig){
  const s=SP[sp];
  if(rig.type==='worm')return s.baits.worm||0;
  const fam=FAM[rig.id]||'spinner';
  let w=s.baits[fam]||0;
  if(LID[rig.id]&&LID[rig.id].big&&s.baits.big)w=Math.max(w,s.baits.big);
  return w;
}

/* ======================= 4. POPULATION ======================= */
function buildPop(){
  const r=lcg(SAVE.lakeSeed); const pop=[]; let id=0;
  for(const sp of SPLIST){
    const s=SP[sp];
    for(let i=0;i<s.n;i++){
      const spotKeys=Object.keys(s.spots);
      let home='weed';
      if(spotKeys.length){ // weighted home
        let tot=0; for(const k of spotKeys)tot+=s.spots[k];
        let x=r()*tot; for(const k of spotKeys){x-=s.spots[k]; if(x<=0){home=k;break}}
      }
      const base=s.inch[0]+Math.pow(r(),1.25)*(s.inch[1]-s.inch[0])*.72;
      pop.push({i:id++,sp:sp,b:Math.round(base*10)/10,w:Math.round(s.wary*(0.6+0.8*r())*100)/100,h:home,sU:0,c:0});
    }
  }
  const mf=pop.find(f=>f.sp==='mayor'); if(mf){mf.b=47;mf.h='weed'}
  const gf=pop.find(f=>f.sp==='gar'); if(gf){gf.b=32;gf.h='mud'}
  SAVE.pop=pop; markSave();
}
function sizeNow(f){
  const s=SP[f.sp];
  const days=dayNum(Date.now())-SAVE.day0;
  return Math.min(s.inch[1], Math.round((f.b+s.grow*days)*10)/10);
}
function lbs(inches,sp){ // rough weight; panfish keep it to length
  const k=(sp==='carp'||sp==='catfish')?.00045:(sp==='pike'||sp==='mayor'||sp==='gar')?.00028:.00050;
  return Math.round(k*Math.pow(inches,3)*10)/10;
}
function candidates(spot,rig){
  const out=[]; if(!SAVE.pop)buildPop();
  const nowT=Date.now();
  for(const f of SAVE.pop){
    const s=SP[f.sp]; if(s.unhookable||f.sp==='mayor')continue;
    if(f.sU>nowT)continue;
    let m=actMult(f.sp,spot)*baitW(f.sp,rig); if(m<=0)continue;
    if(f.h!==spot)m*=.25;                        // roamers
    const t=(sizeNow(f)-s.inch[0])/(s.inch[1]-s.inch[0]||1);
    m*=lerp(1.35,0.65,clamp(t,0,1));             // small fish bite more
    m*=Math.max(.25,1-f.w*(0.5+0.35*Math.min(3,f.c))); // wise fish
    if(m>0.001)out.push({f:f,w:m});
  }
  return out;
}
function totalHeat(spot,rig){let t=0;for(const c of candidates(spot,rig))t+=c.w;return t}
function hottestSpot(){ // for the heron + the old timer (uses worm as the neutral probe)
  let best='dock',bw=0;
  for(const k in SPOTS){ if(SPOTS[k].locked&&!SAVE.farOpen)continue;
    const t=totalHeat(k,{type:'worm'}); if(t>bw){bw=t;best=k} }
  return best;
}

function lightNow(){
  const h=realHour(),st=sunTimes(),sr=st[0],ss=st[1],wx=wxFor(0);
  let A,B,t;
  if(h<sr-1.2||h>ss+1.4){A=B=LKEY.night;t=0}
  else if(h<sr+0.4){A=LKEY.night;B=LKEY.dawn;t=(h-(sr-1.2))/1.6}
  else if(h<sr+1.6){A=LKEY.dawn;B=LKEY.gold;t=(h-(sr+0.4))/1.2}

  else if(h<ss+0.6){A=LKEY.dusk;B=LKEY.night;t=(h-(ss-0.8))/1.4}
  else {A=B=LKEY.night;t=0}
  const L=[]; for(let i=0;i<8;i++)L.push(mix(A[i],B[i],clamp(t,0,1)));
  if(wx.sky!=='clear'){for(let i=0;i<8;i++)L[i]=mix(L[i],'#9aa4ac',wx.rain?.42:.3)}
  L.night = (h<sr-0.6||h>ss+0.8); L.h=h; L.sr=sr; L.ss=ss;
  L.dim = L.night?1:(h>ss-1.2||h<sr+.4)?.55:(h>ss-2.2||h<sr+1.2)?.25:0;
  return L;
}

    X.lineTo(tailX-len*.1, dep*.18);

  X.lineTo(tailX+len*.04*sh.tail,0);

  if(sh.blotch){X.fillStyle=pal[2];const r3=lcg(hash32(spKey)+9);for(let i=0;i<20;i++)blob(nose+len*(.1+r3()*.8),-dep*.7+r3()*dep*1.3,len*.03,dep*.12,mixR(pal[2],'#000',.2,.6))}

  }

  X.lineTo(W,HOR);X.closePath();X.fill();
  X.fillStyle=L[5];
  X.beginPath();X.moveTo(0,HOR);
  for(let x=0;x<=W;x+=8){const n=Math.sin((x+p2)*.05)*4+Math.sin((x+p2)*.013)*9;X.lineTo(x,HOR-8-Math.abs(n)-6)}
  X.lineTo(W,HOR);X.closePath();X.fill();
  // inlet notch in the far shore
  const inx=worldX((SPOTS.inlet.x0+SPOTS.inlet.x1)/2)*1;
  if(inx>-60&&inx<W+60){X.fillStyle=L[3];X.beginPath();X.moveTo(inx-26,HOR);X.quadraticCurveTo(inx,HOR-16,inx+26,HOR);X.closePath();X.fill()}
  // water
  g=X.createLinearGradient(0,HOR,0,BANKY);
  g.addColorStop(0,L[2]); g.addColorStop(.25,L[3]); g.addColorStop(1,mix(L[3],'#0c1a14',.35));
  X.fillStyle=g; X.fillRect(0,HOR,W,BANKY-HOR);
  // tree reflections — soft seeded smudges, not a comb
  {const rr=lcg(hash32('refl'));X.fillStyle=mixR(L[5],'#0a141a',.4,1);
   let x=-10;
   while(x<W){const wdt2=8+rr()*20,hgt=8+rr()*26;
     if(rr()>.34){X.globalAlpha=.06+rr()*.06;X.fillRect(x,HOR+2,wdt2,hgt)}
     x+=wdt2+6+rr()*26}
   X.globalAlpha=1}
  // sun glitter path on the water
  if(!L.night){
    const dayT=clamp((L.h-L.sr)/(L.ss-L.sr),0,1), gx=lerp(120,W-120,dayT);
    const low=(dayT<.18||dayT>.82), ga=(low?.34:.13)*(wx.sky==='clear'?1:.4);
    X.fillStyle=mixR(L[7],'#ffffff',.3,1);
    const gr=lcg(hash32('glit'));
    for(let i=0;i<26;i++){const gy=HOR+8+i*((BANKY-HOR-40)/26),
      jx=gx+(gr()-.5)*(26+i*3.4)+Math.sin(t*1.3+i*2.2)*5,

    X.globalAlpha=1;
  }
  // waterline contact edge
  X.fillStyle=mixR(L[7],'#ffffff',.25,L.night?.10:.28);X.fillRect(0,HOR,W,1.2);
  // drop-off darkening
  const d0=worldX(SPOTS.drop.x0), d1=worldX(SPOTS.drop.x1+140);
  if(d1>0&&d0<W){const dg=X.createLinearGradient(d0,0,d0+70,0);
    dg.addColorStop(0,'rgba(10,24,26,0)');dg.addColorStop(1,'rgba(8,20,24,.35)');
    X.fillStyle=dg;X.fillRect(d0,HOR+10,70,BANKY-HOR-30);
    X.fillStyle='rgba(8,20,24,.35)';X.fillRect(d0+70,HOR+10,Math.min(W,d1)-(d0+70),BANKY-HOR-30)}
  // mud flats tint
  const m0=worldX(SPOTS.mud.x0),m1=worldX(SPOTS.mud.x1);
  if(m1>0&&m0<W){X.fillStyle='rgba(96,74,44,.22)';X.fillRect(m0,HOR+8,m1-m0,BANKY-HOR-20)}
  // weed edge — dark water below, thin reeds above, stalk shadows between
  const w0=worldX(SPOTS.weed.x0),w1=worldX(SPOTS.weed.x1);
  if(w1>0&&w0<W){
    const wr=lcg(hash32('weed'));
    for(let i=0;i<4;i++)blob(lerp(w0,w1,.12+.76*wr()),HOR+30+wr()*26,26+wr()*18,6+wr()*4,'rgba(18,40,24,.16)');
    for(let i=0;i<14;i++){const sx2=lerp(w0,w1,wr());

      X.strokeStyle=mixR('#4a7a40','#1b241c',L.dim*.6,.8);X.lineWidth=1.6;

      X.quadraticCurveTo(sx2+2,HOR-4,sx2+3+Math.sin(t*.9+i)*2.4,HOR-13-((i*13)%7));X.stroke()}
  }
  // ripple lines
  X.strokeStyle=mixR(L[7],'#ffffff',.2,L.night?.06:.13);X.lineWidth=1.1;
  for(let i=0;i<16;i++){const ry=HOR+16+i*((BANKY-HOR-30)/16),
    ph2=t*(6+i*1.5)*(wx.wind.str+.3)*wx.wind.dir, wid=30+i*9;

  // wind foam on windward side
  if(wx.wind.str>.55){const sideX=wx.wind.dir>0?W*.7:W*.05;
    X.fillStyle='rgba(255,255,255,.10)';
    for(let i=0;i<8;i++)blob(sideX+((t*30+i*90)%(W*.3)),HOR+30+i*20,20,2.2,'rgba(255,255,255,.12)')}
  // rain
  if(wx.rain){X.strokeStyle='rgba(210,225,235,.35)';X.lineWidth=1;
    for(const d of SC.drops){X.beginPath();X.moveTo(d.x,d.y);X.lineTo(d.x-2,d.y+9);X.stroke()}
    X.strokeStyle='rgba(255,255,255,.14)';
    for(const d of SC.rings){X.beginPath();X.ellipse(d.x,d.y,d.r,d.r*.3,0,0,7);X.stroke()} }
  // spot fixtures
  drawDock(L); drawPads(L,t); drawBoat(L); drawWillow(L,t); drawBank(L,t);
  // tells + critters
  drawTells(L,t);
}

    retrieve:SAVE.rig.type==='lure',lx:1,ly:8,duty:[],toggles:0,cad:0,snag:null,strike:null,fig8Done:false};
  SFX.cast();
}
function buildScript(line){
  const cands=candidates(line.spot,SAVE.rig);
  let heat=0; for(const c of cands)heat+=c.w;
  heat*=line.boost;
  const r=simRng('cast'+SAVE.casts);
  const eff=Math.sqrt(heat); // sums of ~50 candidates saturate; sqrt keeps waits honest
  const evs=[]; let t=rnd(r,TUNE.firstWait[0],TUNE.firstWait[1])/Math.max(.4,Math.min(1.9,.35+eff*.13));
  for(let i=0;i<7;i++){
    const isFalse=r()<TUNE.falseP || heat<=0.02 || !cands.length;
    if(isFalse){
      const canTurtle=(line.spot==='mud'||line.spot==='dock'||line.spot==='pads');
      const kind=canTurtle&&r()<TUNE.turtleP?'turtle':(r()<.5?'nibbler':(r()<.5?'weeds':'wave'));
      evs.push({t:t,kind:kind});
    }else if(r()<clamp(.2+eff*.075,.12,.8)){
      let x=r()* (heat||1), fish=cands.length?cands[0].f:null;
      for(const c of cands){x-=c.w;if(x<=0){fish=c.f;break}}
      if(fish)evs.push({t:t,kind:'bite',f:fish});
    }else evs.push({t:t,kind:'wave'});
    t+=rnd(r,TUNE.eventGap[0],TUNE.eventGap[1]);
  }
  line.script=evs; line.si=0;
}
/* ---- the wait ---- */
function startCue(line,ev){
  const f=ev.f,s=SP[f.sp],sig=s.sig,r=simRng('sig'+SAVE.casts+'-'+line.si);
  const taps=Math.round(rnd(r,sig.fake[0],sig.fake[1]));
  line.ev={f:f,sig:sig,stage:taps>0?'taps':'cue',taps:taps,tapI:0,tapT:rnd(r,sig.gap[0],sig.gap[1]),t:0,cueT:0,set:false,armT:0};
  line.anim={type:'idle',ph:0};
}
function updWait(line,dt){
  line.waitT+=dt;
  if(!line.script)buildScript(line);
  // ambient events fire
  if(!line.ev&&line.si<line.script.length&&line.waitT>=line.script[line.si].t){
    const ev=line.script[line.si++];
    if(ev.kind==='bite')startCue(line,ev);
    else if(ev.kind==='turtle'){line.ev={turtle:true,t:0,stage:'turtle'};line.anim={type:'tug',ph:0}}
    else if(ev.kind==='nibbler'){line.anim={type:'dance',ph:0,n:3};SP.bluegill&&SFX.blip();
      if(simR()<.5){if(SAVE.rig.type==='worm'){SAVE.worms=Math.max(0,SAVE.worms-0);}}}
    else if(ev.kind==='weeds'){line.anim={type:'drift',ph:0}}
    else {line.anim={type:'nod',ph:0}}
  }
  if(G.spookT>0){G.spookT-=dt}
  const ev=line.ev;
  if(!ev)return decayAnim(line,dt);
  ev.t+=dt;
  if(ev.turtle){ // steady pull, never runs; player set → the turtle
    line.anim={type:'tug',ph:ev.t};
    if(ev.t>9){line.ev=null;line.anim={type:'idle',ph:0};if(SAVE.rig.type==='worm')SAVE.worms=Math.max(0,SAVE.worms-1);
      toast('the worm is gone. no drama. turtle math.');SAVE.tally.turtle++;markSave()}
    return;
  }
  const sig=ev.sig;
  if(ev.stage==='taps'){
    ev.tapT-=dt;
    line.anim.type='idle';
    if(ev.tapT<=0){ev.tapI++;line.anim={type:'tap',ph:0};SFX[sig.voice]&&SFX[sig.voice]();
      const r=simRng('tap'+SAVE.casts+'-'+line.si+'-'+ev.tapI);
      ev.tapT=rnd(r,sig.gap[0],sig.gap[1]);
      if(ev.tapI>=ev.taps){ev.stage='cue';ev.cueT=0}}
  }else if(ev.stage==='cue'){
    ev.cueT+=dt;
    if(ev.cueT<.05&&!ev.cued){ev.cued=true;
      line.anim={type:sig.cue,ph:0};
      SFX[sig.voice]&&SFX[sig.voice]();
      if(sig.cue==='slash')SFX.slam();
    }
    line.anim.ph=ev.cueT;
    const wEnd=sig.win[1];
    if(sig.hold&&ev.armT>0){ // walleye sweep: held long enough?
      if(G.holding)ev.armT+=dt; else ev.armT=0;
      if(ev.armT>=.35){hookFish(ev.f);return}
    }
    if(ev.cueT>wEnd+.4){ // dropped it
      line.ev=null;line.anim={type:'idle',ph:0};
      if(SAVE.rig.type==='worm'&&simR()<.6)SAVE.worms=Math.max(0,SAVE.worms-1);
      toast(LESSONS.late); markSave();
    }
  }
}
function decayAnim(line,dt){ if(line.anim.type!=='idle'){line.anim.ph+=dt;if(line.anim.ph>1.4)line.anim={type:'idle',ph:0}} }
function trySet(){
  const line=G.line; if(!line)return;
  if(line.retrieve){ if(line.strike){resolveStrike();return}
    // no strike: nothing (retrieve handled by hold)
    return }
  const ev=line.ev;
  if(!ev||ev.turtle){
    if(ev&&ev.turtle){line.ev=null;line.anim={type:'idle',ph:0};SAVE.tally.turtle++;
      if(SAVE.rig.type==='worm')SAVE.worms=Math.max(0,SAVE.worms-1);
      toast('the turtle. again. he is not a fish and he knows it.');markSave();return}
    // empty set — nerves
    G.clicks.push(SC.t);
    G.clicks=G.clicks.filter(c=>SC.t-c<3);
    if(G.clicks.length>5&&G.spookT<=0){G.spookT=TUNE.spookSecs;
      toast('quiet on the water.'); supNote('quiet')}
    line.anim={type:'tap',ph:0}; SFX.plop(.3);
    return;
  }

  }

  if(tC<sig.win[0]){ line.ev=null;line.anim={type:'idle',ph:0};toast(LESSONS.early);
    if(SAVE.rig.type==='worm'&&simR()<.5)SAVE.worms=Math.max(0,SAVE.worms-1); return }
  if(tC<=sig.win[1]){ hookFish(ev.f); return }
  line.ev=null;line.anim={type:'idle',ph:0};toast(LESSONS.late);

/* ---- the fight ---- */
function fightScript(sp,size){
  const s=SP[sp].fight,r=simRng('fight'+SAVE.casts),seq=[];
  const runN=s.runs||0;
  function push(k,d){seq.push({k:k,d:d})}
  if(s.shape==='circle'||s.shape==='kick'){push('tug',2.2);push('calm',1.6);push('tug',1.8);push('calm',2)}
  else if(s.shape==='quit'){push('run',1.2);push('calm',2);push('tug',1.2)}
  else if(s.shape==='paper'){push('tug',1.6);push('calm',1.4);push('run',1.4);push('calm',2)}
  else if(s.shape==='jump'){for(let i=0;i<runN;i++){push('run',rnd(r,1.2,2));push('calm',rnd(r,1,1.8));if(i<(s.jumps||0))push('jump',.9)}push('calm',2)}
  else if(s.shape==='slash'){for(let i=0;i<runN;i++){push('run',rnd(r,1.6,2.6));if(i===1)push('teeth',.01);push('calm',rnd(r,1,1.6))}push('roll',1.2);push('calm',2)}
  else if(s.shape==='dog'){push('tug',2.4);push('run',1.6);push('tug',2.6);push('run',1.4);push('tug',2)}
  else if(s.shape==='haul'){for(let i=0;i<runN;i++){push('run',rnd(r,2.4,3.6));push('tug',rnd(r,1.8,2.6))}}
  else if(s.shape==='marathon'){for(let i=0;i<5;i++){push('run',rnd(r,3,4.5));push('calm',rnd(r,1.6,2.4))}}
  else if(s.shape==='roll'){push('run',1.6);push('roll',1.4);push('calm',1.2);push('run',1.4);push('roll',1.4)}
  else if(s.shape==='spin'){push('tug',2.4);push('calm',1.8)}
  else if(s.shape==='mayor'){push('run',4);push('mayorsnap',.01);push('dog2',3);push('run',3.4);push('roll',1.6);push('calm',2);push('run',2.6);push('calm',2)}
  push('weedcheck',.01);
  return seq;
}
function hookFish(f){

  line.ev=null;
  G.fight={f:f,sp:sp,size:size,T:24,line:60,stam:s.fight.stam*size*.55,seq:fightScript(sp,size),
    seg:0,segT:0,dist:1,surf:false,flat:false,flatT:0,thrashT:0,t:0,
    cap:s.sig.gentle?52:100,jumpWin:0,weed:null,weedT:0,spot:line.spot,dir:(simR()<.5?-1:1),done:false};
  G.mode='fight'; SFX.splash(size/18); AU.drag=true;

}
function updFight(dt){
  const F=G.fight; if(!F)return; F.t+=dt;
  const s=SP[F.sp].fight, seg=F.seq[Math.min(F.seg,F.seq.length-1)];
  F.segT+=dt;
  let running=false;
  switch(seg.k){
    case 'run': running=true; F.line-=dt*(F.sp==='carp'||F.sp==='mayor'?7:4.5);
      if(G.holding)F.T+=dt*30; else F.T-=dt*10;
      F.dist=Math.min(1.2,F.dist+dt*.1); break;
    case 'tug': if(G.holding){F.T+=dt*13;F.dist-=dt*.10;F.stam-=dt*1.1} else F.T-=dt*16; break;
    case 'calm': if(G.holding){F.T+=dt*8;F.dist-=dt*.16;F.stam-=dt*1.4;F.line=Math.min(60,F.line+dt*2)} else F.T-=dt*20; break;
    case 'jump':
      if(!seg.hit){seg.hit=true;F.jumpWin=.75;SFX.splash(F.size/16);}
      break;
    case 'teeth': // pike bite-off check
      F.seg++;F.segT=0;
      if(!lureIs('wire')&&(SAVE.rig.type==='lure')&&!hasWire()&&simR()<(s.biteoff||0)){
        endFight('biteoff');return}
      break;
    case 'mayorsnap':
      F.seg++;F.segT=0;
      if(SAVE.mayor.hooked===0){ endFight('mayorsnap'); return }
      break;
    case 'dog2': if(G.holding){F.T+=dt*14;F.dist-=dt*.08;F.stam-=dt*.9} else F.T-=dt*14; break;
    case 'roll': running=true; if(G.holding)F.T+=dt*22; else F.T-=dt*8; F.stam-=dt*.8; break;
    case 'spin': if(G.holding){F.T+=dt*10;F.dist-=dt*.14;F.stam-=dt*1.2} else F.T-=dt*14; break;
    case 'weedcheck':
      F.seg++;F.segT=0;
      if((F.spot==='pads'||F.spot==='weed')&&(F.sp==='largemouth'||F.sp==='pike'||F.sp==='bowfin')&&simR()<.55&&!F.weedDone){
        F.weedDone=true;F.weed={dir:F.dir,t:1.5};toast(F.dir<0?'she’s making for the pads — pull RIGHT':'she’s making for the weeds — pull LEFT')}
      break;
  }
  if(F.jumpWin>0){F.jumpWin-=dt;
    if(G.holding&&F.jumpWin>0&&!F.jPen){F.jPen=true;F.T+=30;
      if(F.T>F.cap*.78&&simR()<.35){endFight('jump');return}}
    if(F.jumpWin<=0&&!F.jPen)toast('she jumped. you bowed. good hands.')}
  if(F.weed){F.weed.t-=dt;
    if(G.steer===-F.weed.dir){F.weed=null;toast('turned her. the weeds keep waiting.')}
    else if(F.weed.t<=0){endFight('wrap');return}}
  AU.drag=running; AU.reel=(G.holding&&!running)?1:0;
  F.T=clamp(F.T,0,120);
  if(F.t>12)F.stam-=dt*.4; // a fish on a line is always tiring, even if you just hold on
  if(F.T>=F.cap){endFight(F.cap<100?'tear':'snap');return}
  if(F.line<=0){endFight('snap');return}
  if(F.segT>=seg.d&&seg.k!=='jump'||seg.k==='jump'&&F.jumpWin<=0&&F.segT>=seg.d){F.seg++;F.segT=0;
    if(F.seg>=F.seq.length){ if(F.stam>0){F.seq.push({k:G.holding?'tug':'calm',d:1.5})} }}
  if(F.stam<=0&&F.dist<=.3&&!F.surf){F.surf=true;F.thrashT=rnd(simRng('gr'+SAVE.casts),1.3,2.4);SFX.splash(F.size/14)}
  if(F.surf){
    if(!F.flat){F.thrashT-=dt;if(F.thrashT<=0){F.flat=true;F.flatT=2.6}}
    else {F.flatT-=dt;if(F.flatT<=0){F.flat=false;F.thrashT=rnd(simRng('gr2'+SAVE.casts+F.t),0.8,1.6)}}
  }
}
function hasWire(){return SAVE.lures.wire&&SAVE.lures.wire.found&&!SAVE.lures.wire.lost}
function lureIs(id){return SAVE.rig.type==='lure'&&SAVE.rig.id===id}
function tryNet(){
  const F=G.fight; if(!F||!F.surf)return;

function endFight(cause){

  SFX.snap();

function land(){

/* ======================= 8. RETRIEVE · SNAG · THE MAYOR ======================= */
const VERBT={wind:[.82,1],twitch:[.3,.6],hop:[.2,.5],walk:[.45,.7],gear:[0,1]};
function updRetrieve(line,dt){
  if(SAVE.rig.type!=='lure'||!LID[SAVE.rig.id]){line.retrieve=false;G.line=null;return}
  line.waitT+=dt;
  // cadence tracking
  line.duty.push({t:SC.t,h:G.holding?1:0});
  line.duty=line.duty.filter(d=>SC.t-d.t<2.5);
  let on=0; for(const d of line.duty)if(d.h)on++;
  const duty=line.duty.length?on/line.duty.length:0;
  const vb=VERBT[LID[SAVE.rig.id].verb]||VERBT.wind;
  line.cad=duty>=vb[0]&&duty<=vb[1]?1:Math.max(.15,1-Math.min(Math.abs(duty-vb[0]),Math.abs(duty-vb[1]))*2.2);
  // movement
  if(line.snag){updSnag(line,dt);return}
  if(G.holding)line.lx=Math.max(0,line.lx-dt*(LID[SAVE.rig.id].verb==='wind'?.14:.10));
  else if(LID[SAVE.rig.id].verb!=='frog')line.ly=Math.min(28,(line.ly||8)+dt*10);
  AU.reel=G.holding?1.4:0;
  const prog=1-line.lx; // 0 start → 1 at bank
  // snags
  if(G.holding&&simTick(line,'snagRoll',.5)){
    const sn=SPOTS[line.spot].snag*(LID[SAVE.rig.id].verb==='hop'?1.6:1)*.14;
    if(simR()<sn){line.snag={t:0,work:0};AU.drag=false;SFX.thump();toast('hung up. work it loose — or give it slack.')}
  }
  // strikes
  if(!line.strike&&G.holding&&simTick(line,'strikeRoll',1.1)){
    const cands=candidates(line.spot,SAVE.rig);
    let heat=0;for(const c of cands)heat+=c.w; heat*=line.boost*line.cad;
    if(cands.length&&simR()<clamp(heat*.09,0,.5)){
      let x=simR()*heat/Math.max(.01,line.cad),fish=cands[0].f;
      let tot=0;for(const c of cands)tot+=c.w; x=simR()*tot;
      for(const c of cands){x-=c.w;if(x<=0){fish=c.f;break}}
      const s=SP[fish.sp];
      line.strike={f:fish,t:0,frog:LID[SAVE.rig.id].verb==='walk'};
      SFX[s.sig.voice]&&SFX[s.sig.voice]();
      if(!line.strike.frog)SFX.slam();
      else SFX.splash(.8);
    }
  }
  if(line.strike){
    line.strike.t+=dt;
    const lim=line.strike.frog?2.2:.95;
    if(line.strike.t>lim){line.strike=null;toast(LESSONS.late)}
  }
  // the mayor follows
  updFollow(line,dt,prog);
  if(line.lx<=0.02){ // retrieve finished
    if(G.follow){followEnds(true)}
    line.retrieve=false; G.line=null; AU.reel=0;
  }
}
function simTick(line,key,period){ line[key]=(line[key]||0)+SC.dt; if(line[key]>=period){line[key]=0;return true} return false }
function resolveStrike(){
  const line=G.line,st=line.strike;
  if(st.frog&&st.t<.5){line.strike=null;toast(LESSONS.spit);return}
  line.strike=null; hookFish(st.f);
}
function updSnag(line,dt){

    if(sn.work>1.2){
      if(simR()<TUNE.snagFreeP){ // free!
        line.snag=null;
        if(line.spot==='boat'){
          const lost=refindable();

            SAVE.lures[l.id].lost=0;G.find={l:l,re:1,t:0};SFX.find();markSave();return}

    }

/* ---- ambient world ---- */
function updWorld(dt){
  SC.t+=dt; SC.dt=dt;
  if(!G.fight&&!(G.line&&G.line.retrieve)){AU.drag=false;AU.reel=0}
  if(G.toastT>0){G.toastT-=dt;if(G.toastT<=0)G.toast=null}
  // rain particles
  const wx=wxFor(0);
  if(!SC.rings)SC.rings=[];
  if(wx.rain&&!RM){
    if(!SC.drops.length)for(let i=0;i<60;i++)SC.drops.push({x:Math.random()*W,y:Math.random()*H});
    for(const d of SC.drops){d.x-=dt*30;d.y+=dt*300;if(d.y>BANKY+40){d.y=-10;d.x=Math.random()*W;
      if(Math.random()<.4)SC.rings.push({x:Math.random()*W,y:HOR+20+Math.random()*(BANKY-HOR-40),r:1,a:0})}}
    for(const g2 of SC.rings){g2.r+=dt*9;g2.a+=dt}
    SC.rings=SC.rings.filter(g2=>g2.a<1.2);
  }else{SC.drops.length=0}
  // fireflies
  if(!SC.fireflies){SC.fireflies=[];const r=lcg(55);
    for(let i=0;i<14;i++)SC.fireflies.push({x:r()*W,y:BANKY-20-r()*60,s:.7+r()*1.6,p:r()*7})}
  // heron & gar & nervous & swirls refresh
  SC.hAcc=(SC.hAcc||0)-dt;
  if(SC.hAcc<=0){SC.hAcc=45;
    SC.heronSpot=(hash32(dateKey(0)+Math.floor(realHour()))%3===0)?null:hottestSpot();
    const mo=realMonth();
    SC.garOut=(mo>=6&&mo<=8&&phase()==='day'&&wxFor(0).sky==='clear');
    SC.nervous=[]; SC.swirls=SC.swirls||[];
    const pans=['bluegill','perch','crappie'];
    for(const k in SPOTS){ if(SPOTS[k].locked&&!SAVE.farOpen)continue;
      let h2=0;for(const p of pans)h2+=actMult(p,k);
      if(h2>1.6)SC.nervous.push({x:(SPOTS[k].x0+SPOTS[k].x1)/2+((hash32(k+dateKey(0))%80)-40),
        y:HOR+30+(hash32(k)%60),r:26+(hash32(k)%20),shower:h2>2.6?1:0});
    }
  }
  if(!SC.swirls)SC.swirls=[];
  SC.swAcc=(SC.swAcc||6)-dt;
  if(SC.swAcc<=0){SC.swAcc=7+Math.random()*14;
    let pred=actMult('largemouth','weed')+actMult('pike','weed');
    if(pred>1.2&&!RM)SC.swirls.push({x:SPOTS.weed.x0+Math.random()*(SPOTS.weed.x1-SPOTS.weed.x0),y:HOR+34,a:0})}
  for(const sw of SC.swirls)sw.a+=dt*.5;
  SC.swirls=SC.swirls.filter(s2=>s2.a<1);
  // mayor ambient sighting
  if(G.mode==='lake'&&SAVE.started){
    G.sightT-=dt;
    if(G.sightT<=0){G.sightT=TUNE.mayorSightMin*(0.7+simR()*.8);
      if(simR()<.5&&!SC.mShadow){SC.mShadow={x:SC.cam+W+60,t:0};SAVE.mayor.sightings++;markSave();
        if(EXT.dog)SFX.bark();}}
  }
  if(SC.mShadow){SC.mShadow.t+=dt;SC.mShadow.x-=dt*60;
    if(SC.mShadow.t>14)SC.mShadow=null}
  // camera follows bobber gently
  let target=SC.cam;
  if(G.line&&!G.line.retrieve)target=clamp(G.line.bx-W/2,0,PANW-W);
  else if(G.line&&G.line.retrieve)target=clamp(G.line.bx-W/2,0,PANW-W);
  if(G.camDrag!=null)target=SC.cam;
  SC.cam+=(target-SC.cam)*Math.min(1,dt*2.2);
  SC.cam=clamp(SC.cam,0,PANW-W);
  // save throttle
  if(saveDirty){saveTimer-=dt;if(saveTimer<=0){saveTimer=2;saveNow()}}
}

function bobberPos(line){
  const bx=worldX(line.bx); let by=line.by, dx=0, sunk=0, tilt=0;
  const an=line.anim,ph=an.ph||0;
  switch(an.type){
    case 'idle': by+=Math.sin(SC.t*1.7+line.bx)*1.6; break;
    case 'nod': by+=Math.sin(Math.min(ph*6,3.14))*3; break;
    case 'tap': by+=Math.sin(Math.min(ph*10,3.14))*4.5; break;
    case 'dance': by+=Math.sin(ph*22)*3.4; dx=Math.sin(ph*13)*2.4; break;
    case 'drift': dx=ph*8; by+=1; break;
    case 'tug': by+=3+Math.sin(ph*3)*1.2; dx=Math.sin(ph*.8)*4; break;
    case 'rise': by-=Math.min(7,ph*9); tilt=Math.min(1.35,ph*2.4); break;
    case 'gone': sunk=Math.min(1,ph*3); by+=sunk*14; break;
    case 'slash': dx=Math.min(1,ph*4)*16; sunk=Math.min(1,ph*3); by+=sunk*10; break;
    case 'spongy': by+=Math.min(9,ph*3); break;
    case 'load': by+=Math.min(11,ph*ph*4); break;
    case 'scream': dx=ph*40; by+=4; break;
  }
  return {x:bx+dx,y:by,sunk:sunk,tilt:tilt};
}

G.pxy=null;
function toLog(e){const r=CV.getBoundingClientRect();return {x:(e.clientX-r.left)/VS,y:(e.clientY-r.top)/VS}}
function hitBtn(p){for(let i=BTNS.length-1;i>=0;i--){const b=BTNS[i];
  if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b.id} return null}
function doBtn(id){
  if(id.startsWith('dbg:')){debugBtn(id.slice(4));return}
  switch(id){
    case 'mute': setMute(!SETT.mute); break;
    case 'start': enterLake(); break;
    case 'journal': G.overlay='journal'; G.jPage=0; break;
    case 'box': G.overlay='box'; break;
    case 'closebox': case 'closej': G.overlay=null; break;
    case 'jprev': G.jPage=0; break;
    case 'jnext': G.jPage=1; break;
    case 'home': if(G.mode==='lake'&&G.line){G.overlay='quit'}else{G.mode='title';G.overlay=null} break;
    case 'onemore': G.overlay=null; SAVE.lastCasts++;
      if(SAVE.lastCasts>=3){G.blessed=true;SAVE.lastCasts=0;supNote('third');toast('the third last cast. say nothing.')}
      else toast('one more. the honest lie.'); markSave(); break;
    case 'gohome': G.overlay=null;G.line=null;G.fight=null;AU.drag=false;AU.reel=0;G.mode='title';SAVE.lastCasts=0;saveNow(); break;
    case 'reelin': G.line=null; break;
    case 'net': tryNet(); break;
    case 'rig:worm': SAVE.rig={type:'worm'};markSave(); break;
    case 'dig': SAVE.worms=Math.min(18,SAVE.worms+TUNE.wormsDig);SFX.scribble();
      toast(EXT.jar?'topped up from the jar. the porch provides.':'six from under the hose. the lawn provides.');markSave(); break;
    case 'spit': if(!G.spitNext){G.spitNext=true;supNote('spit');SFX.plop(.3)} break;
    case 'house': try{location.href='https://kylefriesmarketing.github.io/games/'}catch(e){} break;
    default:
      if(id.startsWith('rig:')){SAVE.rig={type:'lure',id:id.slice(4)};markSave()}
  }
}
function enterLake(){
  if(frozen()){G.mode='frozen';return}
  G.mode='lake'; G.sessionCasts=0; SAVE.lastCasts=0;
  if(!G.otRolled){G.otRolled=true;
    G.ot=(hash32(dateKey(0)+'ot')%100)<35&&realHour()<11;
    SC.oldTimer=G.ot;
    if(G.ot){const ks=Object.keys(SPOTS).filter(k=>!SPOTS[k].locked&&k!=='boat');
      const sp2=ks[hash32(dateKey(1)+'spot')%ks.length];
      setTimeout(()=>toast('the old timer: “they were stacked at '+SPOTS[sp2].label+' yesterday. shoulda been here.”',true),1200);}
  }
}
let downP=null,downT=0;
CV.addEventListener('pointerdown',e=>{
  e.preventDefault(); auInit(); if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
  const p=toLog(e); G.pxy=p; downP=p; downT=SC.t;
  const b=hitBtn(p); if(b){doBtn(b);return}
  if(G.find){G.find=null;return}
  if(G.mode==='look'){dismissCard();return}
  if(G.overlay)return;
  if(G.mode==='fight'){G.holding=true;G.steerX=p.x;return}
  if(G.mode!=='lake')return;
  if(G.line){
    G.holding=true;
    if(!G.line.retrieve)trySet();
    else if(G.line.strike)resolveStrike();
    if(G.line&&G.line.retrieve&&G.line.lx<.15){G.fig8.last=Math.atan2(p.y-(G.line.by||300),p.x-W*.6)}
  }else{
    if(p.y>HOR+8&&p.y<BANKY){G.aim={x:p.x,y:p.y}}
    else if(p.y>=BANKY){G.camDrag={x:p.x,cam:SC.cam}}
  }
},{passive:false});
CV.addEventListener('pointermove',e=>{
  const p=toLog(e); G.pxy=p;
  if(G.aim){G.aim.x=p.x;G.aim.y=clamp(p.y,HOR+12,BANKY-6)}
  if(G.camDrag){SC.cam=clamp(G.camDrag.cam-(p.x-G.camDrag.x),0,PANW-W)}
  if(G.mode==='fight'&&G.holding){const dx=p.x-G.steerX;G.steer=dx>26?1:dx<-26?-1:0}
  if(G.line&&G.line.retrieve&&G.line.lx<.15&&G.holding){
    const cx2=lureScreenX(G.line), cy2=G.line.by;
    const a2=Math.atan2(p.y-cy2,p.x-cx2);
    let d=a2-G.fig8.last; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    G.fig8.arc+=Math.abs(d); G.fig8.last=a2;
  }
});
addEventListener('pointerup',e=>{
  const p=G.pxy||{x:0,y:0};
  if(G.aim){tryCast(clamp(p.x+SC.cam,30,PANW-16));G.aim=null}
  G.camDrag=null; G.holding=false; G.steer=0;
});
addEventListener('keydown',e=>{
  auInit();
  if(e.repeat)return;
  if(e.code==='Space'){G.holding=true;
    if(G.mode==='lake'&&G.line&&!G.line.retrieve)trySet();
    else if(G.line&&G.line.retrieve&&G.line.strike)resolveStrike();
    e.preventDefault()}
  if(e.code==='ArrowLeft'){G.steer=-1;G.fig8.arc+=.5}
  if(e.code==='ArrowRight'){G.steer=1;G.fig8.arc+=.5}
  if(e.key==='j'||e.key==='J')G.overlay=G.overlay==='journal'?null:'journal';
  if(e.key==='b'||e.key==='B')G.overlay=G.overlay==='box'?null:'box';
  if(e.key==='m'||e.key==='M')setMute(!SETT.mute);
  if(e.key==='Escape'){G.overlay=null}
  if(e.key==='Enter'){if(G.mode==='look')dismissCard();else if(G.fight&&G.fight.surf)tryNet();else if(G.find)G.find=null}
});
addEventListener('keyup',e=>{
  if(e.code==='Space')G.holding=false;
  if(e.code==='ArrowLeft'||e.code==='ArrowRight')G.steer=0;
});
function lureScreenX(line){const tip=rodAnchor().x-14;return lerp(tip,worldX(line.bx),line.lx)}

/* ======================= 12. PROBE · DEBUG · QA ======================= */
function runProbe(){
  const el=document.getElementById('probe'); el.style.display='block';
  let out='BITE probe · '+dateKey(0)+' · phase '+phase()+'\n\n30-day weather:\n';
  for(let d=0;d<30;d++){const w2=wxFor(-d);out+=dateKey(-d)+'  '+w2.press.padEnd(8)+w2.sky.padEnd(8)+'wind '+(w2.wind.dir>0?'E':'W')+w2.wind.str.toFixed(2)+'\n'}
  out+='\nheat by spot (worm, now):\n';
  for(const k in SPOTS){out+=SPOTS[k].label.padEnd(20)+totalHeat(k,{type:'worm'}).toFixed(2)+'\n'}
  out+='\n1000 weighted picks @dock/worm:\n';
  const cands=candidates('dock',{type:'worm'}); let tot=0;for(const c of cands)tot+=c.w;
  const dist={},r=lcg(42);
  for(let i=0;i<1000;i++){let x=r()*tot,f2=cands[0]&&cands[0].f;
    for(const c of cands){x-=c.w;if(x<=0){f2=c.f;break}}
    if(f2)dist[f2.sp]=(dist[f2.sp]||0)+1}
  for(const k in dist)out+=k.padEnd(14)+dist[k]+'\n';
  out+='\npop: '+SAVE.pop.length+' fish · journal: '+Object.keys(SAVE.journal).length+' species\n';
  el.textContent=out;
}
function debugBtn(k){
  if(k==='dawn')DBG.hour=sunTimes()[0]+.2;
  if(k==='noon')DBG.hour=13;
  if(k==='dusk')DBG.hour=sunTimes()[1]-.4;
  if(k==='night')DBG.hour=23.5;
  if(k==='real')DBG.hour=null;
  if(k==='fall')DBG.wx={press:'falling',sky:'gray',rain:false,wind:{dir:1,str:.5}};
  if(k==='rain')DBG.wx={press:'falling',sky:'drizzle',rain:true,wind:{dir:1,str:.6}};
  if(k==='high')DBG.wx={press:'high',sky:'clear',rain:false,wind:{dir:-1,str:.3}};
  if(k==='wxoff')DBG.wx=null;
  if(k==='oct')DBG.month=10; if(k==='jul')DBG.month=7; if(k==='jan')DBG.month=1; if(k==='moff')DBG.month=null;
  if(k==='mayor')DBG.mayor=!DBG.mayor;
  if(k==='lures'){for(const l of LURES)SAVE.lures[l.id]={found:1,lost:0};markSave()}
  if(k==='book'){for(const s2 of ['bluegill','perch','crappie','largemouth','rockbass','bullhead'])
    if(!SAVE.journal[s2])SAVE.journal[s2]={caught:3,best:SP[s2].inch[0]+2,notes:1};markSave()}
  if(k==='wipe'){localStorage.removeItem(SAVE_KEY);SAVE=freshSave();buildPop();G.mode='title'}
}
function renderDebug(){
  if(!DEBUG)return;
  const items=[['dawn','dawn'],['noon','noon'],['dusk','dusk'],['night','night'],['real','⏱'],
    ['fall','front'],['rain','rain'],['high','bluebird'],['wxoff','wx✕'],
    ['oct','oct'],['jul','jul'],['jan','jan'],['moff','mo✕'],
    ['mayor',DBG.mayor?'mayor✓':'mayor'],['lures','+lures'],['book','+book'],['wipe','wipe']];
  let x=12;const y=64;
  for(const it of items){const w2=it[1].length*7+18;
    btn('dbg:'+it[0],x,y,w2,20);
    X.fillStyle='rgba(30,20,40,.75)';rrect(x,y,w2,20,5);X.fill();
    txt(it[1],x+w2/2,y+11,10.5,'#e8d8f8','center');x+=w2+6}
}
window.__bite={G:G,SC:SC,SP:SP,SPOTS:SPOTS,LID:LID,TUNE:TUNE,DBG:DBG,
  save:function(){return SAVE},wxFor:wxFor,actMult:actMult,candidates:candidates,phase:phase,
  cast:function(spot){tryCast((SPOTS[spot].x0+SPOTS[spot].x1)/2)},
  forceBite:function(sp){
    const f=SAVE.pop.find(function(q){return q.sp===sp&&q.sU<Date.now()});
    if(!f)return 'none rested';
    if(!G.line)tryCast((SPOTS[f.h]&&!SPOTS[f.h].locked?(SPOTS[f.h].x0+SPOTS[f.h].x1)/2:200));
    if(!G.line)return 'no line';
    G.line.st='wait'; if(!G.line.script)buildScript(G.line);
    startCue(G.line,{f:f}); return f.sp+' '+sizeNow(f)+'"';
  },
  cue:function(){const ev=G.line&&G.line.ev;if(!ev)return null;return {stage:ev.stage,cue:ev.sig&&ev.sig.cue,t:ev.stage==='cue'?ev.cueT:0}},
  set:function(){trySet()},hold:function(b){G.holding=!!b},net:function(){tryNet()},
  hookNow:function(sp){const f=SAVE.pop.find(function(q){return q.sp===sp});if(!f)return 0;
    if(!G.line)tryCast(700);hookFish(f);return 1},
  surface:function(){const F=G.fight;if(!F)return 0;F.stam=0;F.dist=.2;F.surf=true;F.flat=true;return 1},
  step:function(s){let n=Math.max(1,Math.round(s/.05));while(n--)TICK(.05);},
  dismiss:function(){if(G.card)dismissCard();else G.find=null},
  rig:function(id){if(id==='worm')SAVE.rig={type:'worm'};else{SAVE.lures[id]={found:1,lost:0};SAVE.rig={type:'lure',id:id}}markSave()},
  follow:function(){DBG.mayor=true;DBG.hour=sunTimes()[1]-.4;
    this.rig('dusk');if(!G.line)tryCast(690);if(G.line){G.line.retrieve=true;G.line.lx=1;G.line.bx=690}
    G.follow={t:0,seen:true};return 1},
  fig8:function(){G.fig8.arc=99},
  enter:function(){enterLake()},
  errors:[]};

/* ======================= 13. MAIN LOOP ======================= */
function TICK(dt){
  updWorld(dt); ambTick(dt);
  if(G.mode==='lake'&&G.line){
    if(G.line.st==='flight'){G.line.t+=dt;
      if(G.line.t>.45){G.line.st=G.line.retrieve?'ret':'wait';SFX.plop(1);
        if(G.line.retrieve){G.line.lx=1;G.line.ly=8;G.line.bx0=1;maybeFollow(G.line)}}}
    else if(G.line.retrieve)updRetrieve(G.line,dt);
    else if(G.spookT<=0)updWait(G.line,dt);
    else {G.spookT-=0} // spook: bobber sits; updWait paused (spookT decays in updWait normally; decay here)
  }
  if(G.mode==='lake'&&G.line&&G.spookT>0)G.spookT-=dt;
  if(G.mode==='fight')updFight(dt);
  const L=lightNow();
  if(G.mode==='title')renderTitle(L);
  else if(G.mode==='frozen')renderFrozen();
  else if(G.mode==='fight')renderFight(L);
  else if(G.mode==='look'&&G.card)renderCard(L);
  else renderLake(L);
  if(G.find)renderFind(L);
  if(G.overlay==='box')renderBox();
  else if(G.overlay==='journal')renderJournal();
  else if(G.overlay==='quit')renderQuit();
  renderDebug();
  // grain + vignette
  X.save();X.globalAlpha=.5;X.drawImage(grain(),0,0,W,H);X.restore();
  const vg=X.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(4,8,8,.34)');
  X.fillStyle=vg;X.fillRect(0,0,W,H);
}
window.addEventListener('error',function(ev){if(window.__bite)__bite.errors.push(String(ev.message))});
loadSave(); readContracts();
if(EXT.driver)SAVE.farOpen=true;
if(Object.keys(SAVE.journal).length>=10)SAVE.farOpen=true;
if(PROBE)runProbe();
let LAST=performance.now();
document.addEventListener('visibilitychange',function(){LAST=performance.now()});
function frame(t){
  if(!document.hidden){const dt=Math.min(.06,(t-LAST)/1000)*TSCALE; if(dt>0)TICK(dt)}
  LAST=t; requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
